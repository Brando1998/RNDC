name: Auto-Update ChromeDriver

on:
  schedule:
    # Ejecutar cada día a las 2 AM UTC
    - cron: "0 2 * * *"
  workflow_dispatch: # Permite ejecutar manualmente

jobs:
  check-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get current stored version
        id: current_version
        run: |
          if [ -f "drivers/version.txt" ]; then
            version=$(cat drivers/version.txt)
          else
            version="0.0.0.0"
          fi
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Get latest Chrome version
        id: chrome_version
        run: |
          latest=$(curl -s "https://googlechromelabs.github.io/chrome-for-testing/last-known-good-versions-with-downloads.json" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['channels']['Stable']['version'])")
          echo "Latest Chrome version: $latest"
          echo "version=$latest" >> $GITHUB_OUTPUT

      - name: Download ChromeDriver for Windows and Linux
        id: download
        run: |
          current="${{ steps.current_version.outputs.version }}"
          latest="${{ steps.chrome_version.outputs.version }}"

          echo "Current ChromeDriver version: $current"
          echo "Latest Chrome version: $latest"

          if [ "$current" != "$latest" ]; then
            echo "Nueva versión disponible. Descargando..."

            mkdir -p drivers temp

            # Windows (win64)
            curl -L "https://storage.googleapis.com/chrome-for-testing-public/$latest/win64/chromedriver-win64.zip" \
              -o temp/chromedriver-win64.zip
            unzip -o temp/chromedriver-win64.zip -d temp/win64
            cp temp/win64/chromedriver-win64/chromedriver.exe drivers/chromedriver.exe

            # Linux (linux64)
            curl -L "https://storage.googleapis.com/chrome-for-testing-public/$latest/linux64/chromedriver-linux64.zip" \
              -o temp/chromedriver-linux64.zip
            unzip -o temp/chromedriver-linux64.zip -d temp/linux64
            cp temp/linux64/chromedriver-linux64/chromedriver drivers/chromedriver
            chmod +x drivers/chromedriver

            # Guardar versión para futuras comparaciones
            echo "$latest" > drivers/version.txt

            rm -rf temp

            echo "updated=true" >> $GITHUB_OUTPUT
            echo "new_version=$latest" >> $GITHUB_OUTPUT
          else
            echo "ChromeDriver ya está actualizado"
            echo "updated=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push if changed
        if: steps.download.outputs.updated == 'true'
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add drivers/chromedriver.exe drivers/chromedriver drivers/version.txt
          git commit -m "🤖 Auto-update ChromeDriver to v${{ steps.download.outputs.new_version }}"
          git push

      - name: Trigger build workflow
        if: steps.download.outputs.updated == 'true'
        uses: actions/github-script@v6
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'build.yml',
              ref: 'main'
            })
